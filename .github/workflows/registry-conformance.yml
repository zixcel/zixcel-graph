name: Official registry conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  registry-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify published graph lifecycle
        working-directory: conformance/lifecycle
        run: cargo +1.97.1 test --locked --all-features
